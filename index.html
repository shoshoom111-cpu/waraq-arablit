<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجلة وَرَق | انتظرونا قريباً</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Serif+Arabic:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAF9F7;
      --card-bg: #FFFFFF;
      --text-main: #0E0E0E;
      --text-muted: #6B6860;
      --teal: #1A7A7A;
      --teal-dark: #0f5555;
      --border: #E2DFD8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      direction: rtl;
    }

    .container {
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    .brand-name {
      font-family: 'Noto Serif Arabic', serif;
      font-size: 64px;
      font-weight: 700;
      color: var(--teal);
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .status-badge {
      display: inline-block;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      background: #E8F5F2;
      padding: 10px 24px;
      border-radius: 50px;
      margin-bottom: 32px;
      border: 1px solid rgba(26, 122, 122, 0.2);
    }

    /* مربع الرابط المؤقت */
    .link-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    .link-box p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .btn-placeholder {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Cairo', sans-serif;
      color: #FFFFFF;
      background-color: var(--teal);
      border: none;
      border-radius: 10px;
      text-decoration: none;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }

    .btn-placeholder:hover {
      background-color: var(--teal-dark);
    }

    .footer-text {
      margin-top: 40px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="brand-name">مجلة وَرَق</h1>
    
    <div class="status-badge">
      انتظرونا قريباً ⏳
    </div>

    <!-- مربع الرابط -->
    <div class="link-box">
      <p>سيتم إضافة رابط المجلة هنا فور الإطلاق</p>
      
      <a href="#" id="main-link" class="btn-placeholder" onclick="alert('الرابط سيتوفر قريباً!'); return false;">
        🔗 رابط المجلة (قريباً)
      </a>
    </div>

    <div class="footer-text">
      جميع الحقوق محفوظة © مجلة وَرَق
    </div>
  </div>

</body>
</html>
